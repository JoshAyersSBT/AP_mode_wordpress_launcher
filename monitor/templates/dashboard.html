<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<title>PiPress Monitor</title>
<link href="/static/style.css" rel="stylesheet"/>
</head>
<body>
<div id="monitor-app">
<h1>PiPress System Monitor</h1>
<!-- System Status -->
<div class="status-box">
<h2>System Status</h2>
<div class="gauges">
<div :key="metric" class="gauge" v-for="metric in ['cpu', 'ram', 'temp']">
<svg viewbox="0 0 36 36">
<path class="circle-bg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"></path>
<path :id="metric + '-circle'" :stroke="status[metric + '_color']" :stroke-dasharray="status[metric + '_percent'] + ', 100'" class="circle" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"></path>
<g transform="rotate(90 18 18)">
<text :id="metric + '-value'" class="percentage" x="18" y="20"></text>
<text class="label" v-text="metric.toUpperCase()" x="18" y="26"></text>
</g>
</svg>
<pre>{{ status }}</pre></div>
</div>
<p><strong>Apache Status:</strong> <span id="apache-status">{{ status.apache_status }}</span></p>
</div>
<!-- Tabbed Panel -->
<div class="status-box tab-container">
<div class="tabs">
<button :class="{ active: tab === 'ApacheTab' }" @click="setTab('ApacheTab')" class="tablink">Apache Control</button>
<button :class="{ active: tab === 'LauncherTab' }" @click="setTab('LauncherTab')" class="tablink">Launcher Settings</button>
<button :class="{ active: tab === 'LMSTab' }" @click="setTab('LMSTab')" class="tablink">LMS Settings</button>
<button :class="{ active: tab === 'CaptiveTab' }" @click="setTab('CaptiveTab')" class="tablink">Captive Portal</button>
</div>
<div class="tab-content" v-show="tab === 'ApacheTab'">
<div class="controls">
<a href="/control/start"><button>Start</button></a>
<a href="/control/stop"><button>Stop</button></a>
<a href="/control/restart"><button>Restart</button></a>
</div>
</div>
<div class="tab-content" v-show="tab === 'LauncherTab'">
<form action="/update-settings" method="POST">
<label><input :checked="status.use_local" name="use_local" type="checkbox"/> Use Local</label><br/>
<label><input :checked="status.fast_launch" name="fast_launch" type="checkbox"/> Fast Launch</label><br/>
<button type="submit">Save Settings</button>
</form>
</div>
<div class="tab-content" v-show="tab === 'LMSTab'">
<form action="/update-lms" method="POST">
<label>LMS Port: <input :value="status.lms_port" name="lms_port" type="text"/></label><br/>
<label>LMS Directory: <input :value="status.lms_dir" name="lms_dir" type="text"/></label><br/>
<button type="submit">Save LMS Settings</button>
</form>
</div>
<div class="tab-content" v-show="tab === 'CaptiveTab'">
<h3>Captive Portal Manager</h3>
<input @change="handleUpload" multiple="" type="file">
<button @click="upload">Upload</button>
<button @click="restore">Restore Default</button>
<ul>
<li :key="file" v-for="file in fileList">
            {{ file }}
            <button @click="preview(file)">Preview</button>
</li>
</ul>
<div v-if="previewContent">
<h4>Preview:</h4>
<pre>{{ previewContent }}</pre>
</div>
</input></div>
</div>
<!-- Logs -->
<div class="status-box">
<h2>Recent Logs</h2>
<div class="log">
<pre class="log-content"></pre>
</div>
</div>
</div>
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script defer="" src="../static/monitor.js"></script>
</body>
</html>
