<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PiPress Monitor</title>
    <link rel="stylesheet" href="static/style.css">
</head>
<body>
    <h1>PiPress System Monitor</h1>

    <!-- System Status -->
    <div class="status-box">
        <h2>System Status</h2>
        <div class="gauges">
            {% for metric in ['cpu', 'ram', 'temp'] %}
            <div class="gauge">
                <svg viewBox="0 0 36 36">
                    <path class="circle-bg"
                          d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"/>
                    <path class="circle" id="{{ metric }}-circle"
                          stroke="{{ status[metric ~ '_color'] }}"
                          stroke-dasharray="{{ status[metric ~ '_percent'] }}, 100"
                          d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"/>
                    <g transform="rotate(90 18 18)">
                        <text x="18" y="20" class="percentage" id="{{ metric }}-value">{{ status[metric ~ '_load'] if metric != 'temp' else status.temp_c }}</text>
                        <text x="18" y="26" class="label">{{ metric.upper() }}</text>
                    </g>
                </svg>
            </div>
            {% endfor %}
        </div>
        <p><strong>Apache Status:</strong> <span id="apache-status">{{ status.apache_status }}</span></p>
    </div>

    <!-- Tabbed Panel -->
    <div class="status-box tab-container">
        <div class="tabs">
            <button class="tablink active" onclick="openTab(event, 'ApacheTab')">Apache Control</button>
            <button class="tablink" onclick="openTab(event, 'LauncherTab')">Launcher Settings</button>
            <button class="tablink" onclick="openTab(event, 'LMSTab')">LMS Settings</button>
        </div>

        <div id="ApacheTab" class="tab-content active">
            <div class="controls">
                <a href="/control/start"><button>Start</button></a>
                <a href="/control/stop"><button>Stop</button></a>
                <a href="/control/restart"><button>Restart</button></a>
            </div>
        </div>

        <div id="LauncherTab" class="tab-content">
            <form method="POST" action="/update-settings">
                <label><input type="checkbox" name="use_local" {% if use_local %}checked{% endif %}> Use Local</label><br>
                <label><input type="checkbox" name="fast_launch" {% if fast_launch %}checked{% endif %}> Fast Launch</label><br>
                <button type="submit">Save Settings</button>
            </form>
        </div>

        <div id="LMSTab" class="tab-content">
            <form method="POST" action="/update-lms">
                <label>LMS Port: <input type="text" name="lms_port" value="{{ lms_port }}"></label><br>
                <label>LMS Directory: <input type="text" name="lms_dir" value="{{ lms_dir }}"></label><br>
                <button type="submit">Save LMS Settings</button>
            </form>
        </div>
    </div>

    <!-- Logs -->
    <div class="status-box">
        <h2>Recent Logs</h2>
        <div class="log">
            <pre class="log-content">{{ status.logs }}</pre>
        </div>
    </div>

    <script>
        async function fetchStatus() {
            try {
                const res = await fetch("/status");
                const data = await res.json();

                document.getElementById("cpu-value").textContent = data.cpu_load;
                document.getElementById("ram-value").textContent = data.ram_usage;
                document.getElementById("temp-value").textContent = data.temp_c;

                document.getElementById("cpu-circle").setAttribute("stroke-dasharray", `${data.cpu_percent}, 100`);
                document.getElementById("cpu-circle").setAttribute("stroke", data.cpu_color);

                document.getElementById("ram-circle").setAttribute("stroke-dasharray", `${data.ram_percent}, 100`);
                document.getElementById("ram-circle").setAttribute("stroke", data.ram_color);

                document.getElementById("temp-circle").setAttribute("stroke-dasharray", `${data.temp_percent}, 100`);
                document.getElementById("temp-circle").setAttribute("stroke", data.temp_color);

                document.getElementById("apache-status").textContent = data.apache_status;
                document.querySelector(".log-content").textContent = data.logs;
            } catch (err) {
                console.error("Failed to fetch status:", err);
            }
        }

        setInterval(fetchStatus, 100);
        fetchStatus();

        function openTab(evt, tabId) {
            document.querySelectorAll(".tablink").forEach(el => el.classList.remove("active"));
            document.querySelectorAll(".tab-content").forEach(el => el.classList.remove("active"));
            evt.currentTarget.classList.add("active");
            document.getElementById(tabId).classList.add("active");
        }

        window.addEventListener("DOMContentLoaded", () => {
            document.querySelector(".tablink.active")?.click();
        });
    </script>
</body>
</html>
