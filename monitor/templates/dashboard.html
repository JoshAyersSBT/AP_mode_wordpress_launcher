<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>PiPress Monitor</title>
  <link href="/static/style.css" rel="stylesheet"/>
  <style>
    [v-cloak]{display:none}
    .gauges{display:flex;gap:1rem;flex-wrap:wrap}
    .gauge{width:160px}
    .status-box{border:1px solid #ccc;padding:1rem;border-radius:.5rem;margin-bottom:1rem}
    .controls button{margin-right:.5rem}
    svg{width:100%;height:auto}
    .percentage{font-size:6px;text-anchor:middle}
    .label{font-size:4px;text-anchor:middle}
    pre.log-content{max-height:420px;overflow:auto;white-space:pre-wrap}
  </style>
</head>
<body>
<div id="monitor-app" v-cloak>
  <h1>PiPress System Monitor</h1>

  <!-- System Status -->
  <div class="status-box">
    <h2>System Status</h2>
    <div class="gauges">
      <!-- CPU -->
      <div class="gauge">
        <svg viewBox="0 0 36 36">
          <path class="circle-bg"
                d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"></path>
          <path class="circle"
                :stroke="status.cpu_color"
                :stroke-dasharray="status.cpu_percent + ', 100'"
                d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"></path>
          <g transform="rotate(90 18 18)">
            <text class="percentage" x="18" y="20">{{ status.cpu_load }}</text>
            <text class="label" x="18" y="26">CPU</text>
          </g>
        </svg>
      </div>

      <!-- RAM -->
      <div class="gauge">
        <svg viewBox="0 0 36 36">
          <path class="circle-bg"
                d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"></path>
          <path class="circle"
                :stroke="status.ram_color"
                :stroke-dasharray="status.ram_percent + ', 100'"
                d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"></path>
          <g transform="rotate(90 18 18)">
            <text class="percentage" x="18" y="20">{{ status.ram_usage }}</text>
            <text class="label" x="18" y="26">RAM</text>
          </g>
        </svg>
      </div>

      <!-- TEMP -->
      <div class="gauge">
        <svg viewBox="0 0 36 36">
          <path class="circle-bg"
                d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"></path>
          <path class="circle"
                :stroke="status.temp_color"
                :stroke-dasharray="status.temp_percent + ', 100'"
                d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"></path>
          <g transform="rotate(90 18 18)">
            <text class="percentage" x="18" y="20">{{ status.temp_c }}</text>
            <text class="label" x="18" y="26">TEMP</text>
          </g>
        </svg>
      </div>
    </div>
    <p><strong>Apache Status:</strong> {{ status.apache_status }}</p>
  </div>

  <!-- Tabbed Panel -->
  <div class="status-box tab-container">
    <div class="tabs">
      <button class="tablink" :class="{active: tab==='ApacheTab'}"  @click="tab='ApacheTab'">Apache Control</button>
      <button class="tablink" :class="{active: tab==='LauncherTab'}" @click="tab='LauncherTab'">Launcher Settings</button>
      <button class="tablink" :class="{active: tab==='LMSTab'}"     @click="tab='LMSTab'">LMS Settings</button>
      <button class="tablink" :class="{active: tab==='CaptiveTab'}" @click="tab='CaptiveTab'">Captive Portal</button>
    </div>

    <!-- Apache -->
    <div class="tab-content" v-show="tab==='ApacheTab'">
      <div class="controls">
        <a href="/control/start"><button type="button">Start</button></a>
        <a href="/control/stop"><button type="button">Stop</button></a>
        <a href="/control/restart"><button type="button">Restart</button></a>
      </div>
    </div>

    <!-- Launcher -->
    <div class="tab-content" v-show="tab==='LauncherTab'">
      <form action="/update-settings" method="POST">
        <fieldset>
          <legend>Settings</legend>

          <label>
            <input type="checkbox" name="use_local" {{ 'checked' if USE_LOCAL else '' }}>
            Use Local
          </label><br>

          <label>
            <input type="checkbox" name="fast_launch" {{ 'checked' if FAST_LAUNCH else '' }}>
            Fast Launch
          </label><br>

          <label>
            <input type="checkbox" name="verbose" {{ 'checked' if VERBOSE else '' }}>
            Verbose
          </label><br>

          <label>
            <input type="checkbox" name="startup" {{ 'checked' if STARTUP else '' }}>
            Launch on Boot
          </label><br>

          <label>
            <input type="checkbox" name="captiveportal" {{ 'checked' if CAPTIVEPORTAL else '' }}>
            Captive Portal
          </label><br>

          <label>
            <input type="checkbox" name="fti" {{ 'checked' if FTI else '' }}>
            FTI
          </label><br>

          <label>
            SSID:
            <input type="text" name="ssid" value="{{ SSID }}">
          </label><br>

          <label>
            Passphrase:
            <input type="text" name="wap_passphrase" value="{{ WAP_PASSPHRASE }}">
          </label><br>

          <button type="submit">Save Settings</button>
        </fieldset>
      </form>
    </div>

    <!-- LMS -->
    <div class="tab-content" v-show="tab==='LMSTab'">
      <form action="/update-lms" method="POST">
        <label>LMS Port: <input type="text" name="lms_port" value="{{ LMS_PORT }}"/></label><br/>
        <label>LMS Directory: <input type="text" name="lms_dir" value="{{ LMS_DIR }}"/></label><br/>
        <button type="submit">Save LMS Settings</button>
      </form>
    </div>

    <!-- Captive Portal -->
    <div class="tab-content" v-show="tab==='CaptiveTab'">
      <h3>Captive Portal Manager</h3>
      <input type="file" multiple @change="handleUpload">
      <button type="button" @click="upload">Upload</button>
      <button type="button" @click="restore">Restore Default</button>

      <ul>
        <li v-for="file in fileList" :key="file">
          {{ file }}
          <button type="button" @click="preview(file)">Preview</button>
        </li>
      </ul>

      <div v-if="previewContent">
        <h4>Preview:</h4>
        <pre>{{ previewContent }}</pre>
      </div>
    </div>
  </div>

  <!-- Logs (separate section, not a tab) -->
  <div class="status-box">
    <h2>Recent Logs</h2>
    <div style="margin-bottom:.5rem;">
      <label><input type="checkbox" v-model="followLogs"> Follow (auto-scroll)</label>
      <button type="button" @click="refreshLogs" style="margin-left:.5rem;">Refresh</button>
    </div>
    <div class="log">
      <pre ref="logbox" class="log-content">{{ logs }}</pre>
    </div>
  </div>
</div>

<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script>
const app = Vue.createApp({
  data() {
    return {
      tab: 'ApacheTab',
      fileList: [],
      previewContent: '',
      selectedFiles: [],
      // status payload exactly as /status returns it
      status: {
        cpu_load: 0,
        ram_usage: 0,
        temp_c: 0,
        cpu_percent: 0,
        ram_percent: 0,
        temp_percent: 0,
        cpu_color: '#aaa',
        ram_color: '#aaa',
        temp_color: '#aaa',
        apache_status: '',
        logs: '' // fallback if /status includes logs
      },
      // dedicated logs model (for /logs endpoint or fallback)
      logs: '',
      followLogs: true
    }
  },
  methods: {
    setTab(t) { this.tab = t; },
    handleUpload(e) { this.selectedFiles = Array.from(e.target.files); },
    async upload() {
      if (!this.selectedFiles.length) return;
      const form = new FormData();
      this.selectedFiles.forEach(f => form.append("files", f));
      await fetch("/api/captive/upload", { method: "POST", body: form });
      this.loadFiles();
    },
    async preview(filename) {
      const res = await fetch(`/api/captive/preview?file=${encodeURIComponent(filename)}`);
      const json = await res.json();
      this.previewContent = json.content || '';
    },
    async restore() {
      await fetch("/api/captive/restore", { method: "POST" });
      this.loadFiles();
    },
    async loadFiles() {
      const res = await fetch("/api/captive/list");
      this.fileList = await res.json();
    },
    async fetchStatus() {
      try {
        const res = await fetch("/status");
        if (!res.ok) return;
        const data = await res.json();
        this.status = data;
        // If /status carries logs, show them unless we already have /logs content
        if (!this.logs && data.logs) {
          this.logs = data.logs;
          this.$nextTick(this.autoscroll);
        }
      } catch {}
    },
    async refreshLogs() {
      try {
        const r = await fetch('/logs');     // will work if you added /logs; otherwise it just no-ops
        if (!r.ok) return;
        const j = await r.json();
        this.logs = j.logs || '';
        this.$nextTick(this.autoscroll);
      } catch {}
    },
    autoscroll() {
      if (!this.followLogs) return;
      const box = this.$refs.logbox;
      if (box) box.scrollTop = box.scrollHeight;
    }
  },
  mounted() {
    this.loadFiles();
    this.fetchStatus();
    setInterval(this.fetchStatus, 1500);
    // try to pull logs separately if available
    this.refreshLogs();
    setInterval(() => this.refreshLogs(), 3000);
  }
});

app.mount("#monitor-app");
</script>
</body>
</html>
