<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PiPress Monitor</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div id="monitor-app">
    <h1>PiPress System Monitor</h1>

    <!-- System Status -->
    <div class="status-box">
      <h2>System Status</h2>
      <div class="gauges">
        <div class="gauge" v-for="metric in ['cpu', 'ram', 'temp']" :key="metric">
          <svg viewBox="0 0 36 36">
            <path class="circle-bg"
                  d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"/>
            <path class="circle"
                  :id="metric + '-circle'"
                  :stroke="status[metric + '_color']"
                  :stroke-dasharray="status[metric + '_percent'] + ', 100'"
                  d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"/>
            <g transform="rotate(90 18 18)">
              <text x="18" y="20" class="percentage" :id="metric + '-value'"></text>
              <text x="18" y="26" class="label" v-text="metric.toUpperCase()"></text>
            </g>
          </svg>
        </div>
      </div>
      <p><strong>Apache Status:</strong> <span id="apache-status">{{ status.apache_status }}</span></p>
    </div>

    <!-- Tabbed Panel -->
    <div class="status-box tab-container">
      <div class="tabs">
        <button class="tablink" :class="{ active: tab === 'ApacheTab' }" @click="setTab('ApacheTab')">Apache Control</button>
        <button class="tablink" :class="{ active: tab === 'LauncherTab' }" @click="setTab('LauncherTab')">Launcher Settings</button>
        <button class="tablink" :class="{ active: tab === 'LMSTab' }" @click="setTab('LMSTab')">LMS Settings</button>
        <button class="tablink" :class="{ active: tab === 'CaptiveTab' }" @click="setTab('CaptiveTab')">Captive Portal</button>
      </div>

      <div class="tab-content" v-show="tab === 'ApacheTab'">
        <div class="controls">
          <a href="/control/start"><button>Start</button></a>
          <a href="/control/stop"><button>Stop</button></a>
          <a href="/control/restart"><button>Restart</button></a>
        </div>
      </div>

      <div class="tab-content" v-show="tab === 'LauncherTab'">
        <form method="POST" action="/update-settings">
          <label><input type="checkbox" name="use_local" :checked="status.use_local"> Use Local</label><br>
          <label><input type="checkbox" name="fast_launch" :checked="status.fast_launch"> Fast Launch</label><br>
          <button type="submit">Save Settings</button>
        </form>
      </div>

      <div class="tab-content" v-show="tab === 'LMSTab'">
        <form method="POST" action="/update-lms">
          <label>LMS Port: <input type="text" name="lms_port" :value="status.lms_port"></label><br>
          <label>LMS Directory: <input type="text" name="lms_dir" :value="status.lms_dir"></label><br>
          <button type="submit">Save LMS Settings</button>
        </form>
      </div>

      <div class="tab-content" v-show="tab === 'CaptiveTab'">
        <h3>Captive Portal Manager</h3>
        <input type="file" multiple @change="handleUpload" />
        <button @click="upload">Upload</button>
        <button @click="restore">Restore Default</button>
        <ul>
          <li v-for="file in fileList" :key="file">
            {{ file }}
            <button @click="preview(file)">Preview</button>
          </li>
        </ul>
        <div v-if="previewContent">
          <h4>Preview:</h4>
          <pre>{{ previewContent }}</pre>
        </div>
      </div>
    </div>

    <!-- Logs -->
    <div class="status-box">
      <h2>Recent Logs</h2>
      <div class="log">
        <pre class="log-content"></pre>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script>
    const app = Vue.createApp({
      data() {
        return {
          tab: 'ApacheTab',
          fileList: [],
          previewContent: '',
          selectedFiles: [],
          status: {
            cpu_load: 0,
            ram_usage: 0,
            temp_c: 0,
            cpu_percent: 0,
            ram_percent: 0,
            temp_percent: 0,
            cpu_color: '#aaa',
            ram_color: '#aaa',
            temp_color: '#aaa',
            apache_status: '',
            logs: '',
            use_local: false,
            fast_launch: false,
            lms_port: '',
            lms_dir: ''
          }
        };
      },
      methods: {
        setTab(t) { this.tab = t; },
        handleUpload(e) { this.selectedFiles = Array.from(e.target.files); },
        async upload() {
          const form = new FormData();
          this.selectedFiles.forEach(f => form.append("files", f));
          await fetch("/api/captive/upload", { method: "POST", body: form });
          this.loadFiles();
        },
        async preview(file) {
          const res = await fetch(`/api/captive/preview?file=${file}`);
          const json = await res.json();
          this.previewContent = json.content;
        },
        async restore() {
          await fetch("/api/captive/restore", { method: "POST" });
          this.loadFiles();
        },
        async loadFiles() {
          const res = await fetch("/api/captive/list");
          this.fileList = await res.json();
        },
        async fetchStatus() {
          const res = await fetch("/status");
          const data = await res.json();
          this.status = { ...this.status, ...data };

          for (const metric of ['cpu', 'ram', 'temp']) {
            const valueEl = document.getElementById(`${metric}-value`);
            const circleEl = document.getElementById(`${metric}-circle`);
            if (valueEl) {
              valueEl.textContent = metric === 'temp' ? data.temp_c : data[`${metric}_load`];
            }
            if (circleEl) {
              circleEl.setAttribute("stroke-dasharray", `${data[`${metric}_percent`]}, 100`);
              circleEl.setAttribute("stroke", data[`${metric}_color`]);
            }
          }

          const apacheEl = document.getElementById("apache-status");
          if (apacheEl) apacheEl.textContent = data.apache_status;

          const logEl = document.querySelector(".log-content");
          if (logEl) logEl.textContent = data.logs;
        }
      },
      mounted() {
        this.loadFiles();
        this.fetchStatus();
        setInterval(this.fetchStatus, 1000);
      }
    });

    app.mount("#monitor-app");
  </script>
</body>
</html>
