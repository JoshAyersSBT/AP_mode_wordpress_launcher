<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PiPress Monitor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body {
    font-family: sans-serif;
    background-color: #f4f4f4;
    margin: 0;
    padding: 20px;
}
h1 {
    margin-bottom: 10px;
}
.status-box {
    background: white;
    padding: 20px;
    border-radius: 10px;
    margin-bottom: 20px;
    box-shadow: 0px 0px 10px #ccc;
}
.gauges {
    display: flex;
    gap: 40px;
    justify-content: center;
    align-items: center;
    margin-top: 10px;
}
.gauge {
    width: 120px;
    height: 120px;
}
svg {
    width: 100%;
    height: 100%;
    transform: rotate(-90deg);
}
.circle-bg {
    fill: none;
    stroke: #eee;
    stroke-width: 3.8;
}
.circle {
    fill: none;
    stroke-width: 3.8;
    stroke-linecap: round;
    transition: stroke-dasharray 0.5s ease;
}
.percentage {
    font-size: 4px;
    text-anchor: middle;
    fill: #333;
    dominant-baseline: middle;
    font-weight: bold;
}
.label {
    font-size: 2.5px;
    text-anchor: middle;
    fill: #666;
    dominant-baseline: middle;
}
.log {
    background: #222;
    color: #0f0;
    padding: 10px;
    font-family: monospace;
    max-height: 200px;
    overflow-y: auto;
}
.controls button {
    margin-right: 10px;
    padding: 10px 15px;
}

/* Tabs */
.tab-container {
    margin-bottom: 20px;
}
.tabs {
    display: flex;
    background: #ddd;
    border-radius: 10px 10px 0 0;
    overflow: hidden;
}
.tabs button {
    flex: 1;
    padding: 12px;
    background: inherit;
    border: none;
    cursor: pointer;
    font-weight: bold;
    transition: background 0.2s;
}
.tabs button:hover {
    background: #ccc;
}
.tabs button.active {
    background: white;
    border-bottom: 2px solid #f4f4f4;
}
.tab-content {
    display: none;
    padding: 20px;
    border: 1px solid #ccc;
    border-top: none;
    background: white;
}
.tab-content.active {
    display: block;
}
    </style>
</head>
<body>
    <h1>PiPress System Monitor</h1>

    <!-- System Status -->
    <div class="status-box">
        <h2>System Status</h2>
        <div class="gauges">
            <!-- CPU Gauge -->
            <div class="gauge">
                <svg viewBox="0 0 36 36">
                    <path class="circle-bg"
                          d="M18 2.0845
                             a 15.9155 15.9155 0 0 1 0 31.831
                             a 15.9155 15.9155 0 0 1 0 -31.831"/>
                    <path class="circle" id="cpu-circle"
                          stroke="{{ status.cpu_color }}"
                          stroke-dasharray="{{ status.cpu_percent }}, 100"
                          d="M18 2.0845
                             a 15.9155 15.9155 0 0 1 0 31.831
                             a 15.9155 15.9155 0 0 1 0 -31.831"/>
                    <g transform="rotate(90 18 18)">
                        <text x="18" y="20" class="percentage" id="cpu-value">{{ status.cpu_load }}</text>
                        <text x="18" y="26" class="label">CPU</text>
                    </g>
                </svg>
            </div>

            <!-- RAM Gauge -->
            <div class="gauge">
                <svg viewBox="0 0 36 36">
                    <path class="circle-bg"
                          d="M18 2.0845
                             a 15.9155 15.9155 0 0 1 0 31.831
                             a 15.9155 15.9155 0 0 1 0 -31.831"/>
                    <path class="circle" id="ram-circle"
                          stroke="{{ status.ram_color }}"
                          stroke-dasharray="{{ status.ram_percent }}, 100"
                          d="M18 2.0845
                             a 15.9155 15.9155 0 0 1 0 31.831
                             a 15.9155 15.9155 0 0 1 0 -31.831"/>
                    <g transform="rotate(90 18 18)">
                        <text x="18" y="20" class="percentage" id="ram-value">{{ status.ram_usage }}</text>
                        <text x="18" y="26" class="label">RAM</text>
                    </g>
                </svg>
            </div>

            <!-- TEMP Gauge -->
            <div class="gauge">
                <svg viewBox="0 0 36 36">
                    <path class="circle-bg"
                          d="M18 2.0845
                             a 15.9155 15.9155 0 0 1 0 31.831
                             a 15.9155 15.9155 0 0 1 0 -31.831"/>
                    <path class="circle" id="temp-circle"
                          stroke="{{ status.temp_color }}"
                          stroke-dasharray="{{ status.temp_percent }}, 100"
                          d="M18 2.0845
                             a 15.9155 15.9155 0 0 1 0 31.831
                             a 15.9155 15.9155 0 0 1 0 -31.831"/>
                    <g transform="rotate(90 18 18)">
                        <text x="18" y="20" class="percentage" id="temp-value">{{ status.temp_c }}</text>
                        <text x="18" y="26" class="label">TEMP</text>
                    </g>
                </svg>
            </div>
        </div>
        <p><strong>Apache Status:</strong> <span id="apache-status">{{ status.apache_status }}</span></p>
    </div>

    <!-- Tabbed Settings/Control Box -->
    <div class="status-box tab-container">
        <div class="tabs">
            <button class="tablink active" onclick="openTab(event, 'ApacheTab')">Apache Control</button>
            <button class="tablink" onclick="openTab(event, 'LauncherTab')">Launcher Settings</button>
            <button class="tablink" onclick="openTab(event, 'LMSTab')">LMS Settings</button>
        </div>

        <div id="ApacheTab" class="tab-content active">
            <div class="controls">
                <a href="/control/start"><button>Start</button></a>
                <a href="/control/stop"><button>Stop</button></a>
                <a href="/control/restart"><button>Restart</button></a>
            </div>
        </div>

        <div id="LauncherTab" class="tab-content">
            <form method="POST" action="/update-settings">
                <label><input type="checkbox" name="use_local" {% if use_local %}checked{% endif %}> Use Local</label><br>
                <label><input type="checkbox" name="fast_launch" {% if fast_launch %}checked{% endif %}> Fast Launch</label><br>
                <button type="submit">Save Settings</button>
            </form>
        </div>

        <div id="LMSTab" class="tab-content">
            <form method="POST" action="/update-lms">
                <label>LMS Port: <input type="text" name="lms_port" value="{{ lms_port }}"></label><br>
                <label>LMS Directory: <input type="text" name="lms_dir" value="{{ lms_dir }}"></label><br>
                <button type="submit">Save LMS Settings</button>
            </form>
        </div>
    </div>

    <!-- Logs -->
    <div class="status-box">
        <h2>Recent Logs</h2>
        <div class="log">
            <pre class="log-content">{{ status.logs }}</pre>
        </div>
    </div>

    <script>
        async function fetchStatus() {
            try {
                const res = await fetch("/status");
                const data = await res.json();

                document.getElementById("cpu-value").textContent = data.cpu_load;
                document.getElementById("ram-value").textContent = data.ram_usage;
                document.getElementById("temp-value").textContent = data.temp_c;

                document.getElementById("cpu-circle").setAttribute("stroke-dasharray", `${data.cpu_percent}, 100`);
                document.getElementById("cpu-circle").setAttribute("stroke", data.cpu_color);

                document.getElementById("ram-circle").setAttribute("stroke-dasharray", `${data.ram_percent}, 100`);
                document.getElementById("ram-circle").setAttribute("stroke", data.ram_color);

                document.getElementById("temp-circle").setAttribute("stroke-dasharray", `${data.temp_percent}, 100`);
                document.getElementById("temp-circle").setAttribute("stroke", data.temp_color);

                document.getElementById("apache-status").textContent = data.apache_status;
                document.querySelector(".log-content").textContent = data.logs;
            } catch (err) {
                console.error("Failed to fetch status:", err);
            }
        }

        setInterval(fetchStatus, 100); // 0.1s refresh
        fetchStatus();

        function openTab(evt, tabId) {
            const tabs = document.querySelectorAll(".tablink");
            const contents = document.querySelectorAll(".tab-content");

            tabs.forEach(btn => btn.classList.remove("active"));
            contents.forEach(c => c.classList.remove("active"));

            evt.currentTarget.classList.add("active");
            document.getElementById(tabId).classList.add("active");
        }
    </script>
</body>
</html>
