
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PiPress System Monitor</title>
  <script src="https://cdn.jsdelivr.net/npm/vue@3.4.15/dist/vue.global.prod.js"></script>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div id="monitor-app">
    <h1>PiPress System Monitor</h1>

    <div class="card">
      <h2>System Status</h2>
      <div class="status-circles">
        <div class="circle-container">
          <svg width="100" height="100">
            <circle r="45" cx="50" cy="50" fill="none" stroke="#eee" stroke-width="10" />
            <circle id="cpu-circle" r="45" cx="50" cy="50" fill="none" stroke="#aaa" stroke-width="10" stroke-dasharray="0, 100" transform="rotate(-90 50 50)" />
          </svg>
          <div class="circle-label"><span id="cpu-value">0%</span><br>CPU</div>
        </div>
        <div class="circle-container">
          <svg width="100" height="100">
            <circle r="45" cx="50" cy="50" fill="none" stroke="#eee" stroke-width="10" />
            <circle id="ram-circle" r="45" cx="50" cy="50" fill="none" stroke="#aaa" stroke-width="10" stroke-dasharray="0, 100" transform="rotate(-90 50 50)" />
          </svg>
          <div class="circle-label"><span id="ram-value">0%</span><br>RAM</div>
        </div>
        <div class="circle-container">
          <svg width="100" height="100">
            <circle r="45" cx="50" cy="50" fill="none" stroke="#eee" stroke-width="10" />
            <circle id="temp-circle" r="45" cx="50" cy="50" fill="none" stroke="#aaa" stroke-width="10" stroke-dasharray="0, 100" transform="rotate(-90 50 50)" />
          </svg>
          <div class="circle-label"><span id="temp-value">0°C</span><br>TEMP</div>
        </div>
      </div>
      <p><strong>Apache Status:</strong> <span id="apache-status">unknown</span></p>
    </div>

    <div class="tabs">
      <button @click="setTab('ApacheTab')">Apache Control</button>
      <button @click="setTab('LauncherTab')">Launcher Settings</button>
      <button @click="setTab('LMSTab')">LMS Settings</button>
      <button @click="setTab('CaptiveTab')">Captive Portal</button>
    </div>

    <div class="tab-content">
      <div v-show="tab === 'LauncherTab'">
        <form action="/update-settings" method="POST">
          <label><input type="checkbox" name="use_local" v-model="status.use_local"> Use Local</label><br/>
          <label><input type="checkbox" name="fast_launch" v-model="status.fast_launch"> Fast Launch</label><br/>
          <button type="submit">Save Launcher Settings</button>
        </form>
      </div>
      <div v-show="tab === 'LMSTab'">
        <form action="/update-lms" method="POST">
          <label>Port: <input type="text" name="lms_port" v-model="status.lms_port"></label><br/>
          <label>Directory: <input type="text" name="lms_dir" v-model="status.lms_dir"></label><br/>
          <button type="submit">Save LMS Settings</button>
        </form>
      </div>
      <div v-show="tab === 'CaptiveTab'">
        <input type="file" multiple @change="handleUpload"><br/>
        <button @click="upload">Upload</button>
        <button @click="restore">Restore Default</button>
        <ul>
          <li v-for="file in fileList" :key="file" @click="preview(file)">{{ file }}</li>
        </ul>
        <pre>{{ previewContent }}</pre>
      </div>
    </div>

    <div class="card">
      <h2>Recent Logs</h2>
      <div class="log-box"><pre class="log-content"></pre></div>
    </div>
  </div>
  <script src="/static/monitor.js"></script>
</body>
</html>
