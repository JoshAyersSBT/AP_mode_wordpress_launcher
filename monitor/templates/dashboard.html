<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PiPress Monitor</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <h1>PiPress System Monitor</h1>

    <!-- System Status -->
    <div class="status-box">
        <h2>System Status</h2>
        <div class="gauges">
            <!-- Gauges -->
            <div class="gauge" v-for="metric in ['cpu', 'ram', 'temp']" :key="metric">
                <svg viewBox="0 0 36 36">
                    <path class="circle-bg"
                          d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"/>
                    <path class="circle"
                          :id="metric + '-circle'"
                          :stroke="status[metric + '_color']"
                          :stroke-dasharray="status[metric + '_percent'] + ', 100'"
                          d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"/>
                    <g transform="rotate(90 18 18)">
                        <text x="18" y="20" class="percentage" :id="metric + '-value'"></text>
                        <text x="18" y="20" class="percentage" :id="metric + '-value'"></text>
                        <text x="18" y="26" class="label" :id="metric + '-label'" v-text="metric.toUpperCase()"></text>
                    </g>
                </svg>
            </div>
        </div>
        <p><strong>Apache Status:</strong> <span id="apache-status">{{ status.apache_status }}</span></p>
    </div>

    <!-- Tabbed Panel -->
    <div class="status-box tab-container" id="monitor-app">
        <div class="tabs">
            <button class="tablink active" @click="setTab('ApacheTab')">Apache Control</button>
            <button class="tablink" @click="setTab('LauncherTab')">Launcher Settings</button>
            <button class="tablink" @click="setTab('LMSTab')">LMS Settings</button>
            <button class="tablink" @click="setTab('CaptiveTab')">Captive Portal</button>
        </div>

        <!-- Apache -->
        <div id="ApacheTab" class="tab-content" v-show="tab === 'ApacheTab'">
            <div class="controls">
                <a href="/control/start"><button>Start</button></a>
                <a href="/control/stop"><button>Stop</button></a>
                <a href="/control/restart"><button>Restart</button></a>
            </div>
        </div>

        <!-- Launcher -->
        <div id="LauncherTab" class="tab-content" v-show="tab === 'LauncherTab'">
            <form method="POST" action="/update-settings">
                <label><input type="checkbox" name="use_local" {% if use_local %}checked{% endif %}> Use Local</label><br>
                <label><input type="checkbox" name="fast_launch" {% if fast_launch %}checked{% endif %}> Fast Launch</label><br>
                <button type="submit">Save Settings</button>
            </form>
        </div>

        <!-- LMS -->
        <div id="LMSTab" class="tab-content" v-show="tab === 'LMSTab'">
            <form method="POST" action="/update-lms">
                <label>LMS Port: <input type="text" name="lms_port" value="{{ lms_port }}"></label><br>
                <label>LMS Directory: <input type="text" name="lms_dir" value="{{ lms_dir }}"></label><br>
                <button type="submit">Save LMS Settings</button>
            </form>
        </div>

        <!-- Captive Portal -->
        <div id="CaptiveTab" class="tab-content" v-show="tab === 'CaptiveTab'">
            <h3>Captive Portal Manager</h3>
            <input type="file" multiple @change="handleUpload" />
            <button @click="upload">Upload</button>
            <button @click="restore">Restore Default</button>
            <ul>
                <li v-for="file in fileList" :key="file">
                    {{ file }}
                    <button @click="preview(file)">Preview</button>
                </li>
            </ul>
            <div v-if="previewContent">
                <h4>Preview:</h4>
                <pre>{{ previewContent }}</pre>
            </div>
        </div>
    </div>

    <!-- Logs -->
    <div class="status-box">
        <h2>Recent Logs</h2>
        <div class="log">
            <pre class="log-content">{{ status.logs }}</pre>
        </div>
    </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <script>
        const app = Vue.createApp({
            data() {
                return {
                    tab: 'ApacheTab',
                    fileList: [],
                    previewContent: '',
                    selectedFiles: [],
                    status: {
                        cpu_load: 0,
                        ram_usage: 0,
                        temp_c: 0,
                        cpu_percent: 0,
                        ram_percent: 0,
                        temp_percent: 0,
                        cpu_color: '#aaa',
                        ram_color: '#aaa',
                        temp_color: '#aaa',
                        apache_status: '',
                        logs: ''
                    }
                }
            },
            methods: {
                setTab(t) { this.tab = t },
                handleUpload(e) { this.selectedFiles = Array.from(e.target.files) },
                async upload() {
                    const form = new FormData();
                    this.selectedFiles.forEach(f => form.append("files", f));
                    await fetch("/api/captive/upload", { method: "POST", body: form });
                    this.loadFiles();
                },
                async preview(filename) {
                    const res = await fetch(`/api/captive/preview?file=${filename}`);
                    const json = await res.json();
                    this.previewContent = json.content;
                },
                async restore() {
                    await fetch("/api/captive/restore", { method: "POST" });
                    this.loadFiles();
                },
                async loadFiles() {
                    const res = await fetch("/api/captive/list");
                    this.fileList = await res.json();
                },
                async fetchStatus() {
                    const res = await fetch("/status");
                    const data = await res.json();
                    this.status = data;
                    for (const m of ['cpu', 'ram', 'temp']) {
                        document.getElementById(`${m}-value`).textContent = m === 'temp' ? data.temp_c : data[`${m}_load`];
                        document.getElementById(`${m}-circle`).setAttribute("stroke-dasharray", `${data[`${m}_percent`]}, 100`);
                        document.getElementById(`${m}-circle`).setAttribute("stroke", data[`${m}_color`]);
                    }
                    document.getElementById("apache-status").textContent = data.apache_status;
                    document.querySelector(".log-content").textContent = data.logs;
                }
            },
            mounted() {
                this.loadFiles();
                this.fetchStatus();
                setInterval(this.fetchStatus, 1000);
            }
        });

        app.mount("#monitor-app");
    </script>
</body>
</html>
